<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDMS Economic Dossier – Improved Data-Entry PROTOTYPE</title>

<style>
:root{--navy:#0B1F3A;--gold:#C9A227;--bg:#F4F5F7;--ink:#1b2430;--mut:#4a5568;--line:#d5d9e0;--err:#b3261e;--warn:#8a5a00;--ok:#1b7a3d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
.banner{background:#7a1010;color:#fff;text-align:center;padding:6px 10px;font-weight:700;font-size:13px;letter-spacing:.3px;position:sticky;top:0;z-index:50}
header.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
.wrap{max-width:1080px;margin:0 auto;padding:0 14px}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px}
.logo{font-weight:700;font-size:20px;color:var(--gold);letter-spacing:1px}
.who{margin-left:auto;font-size:13px;text-align:right}
.who small{display:block;opacity:.85}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:6px;padding:8px 14px;min-height:40px}
button.pri{background:var(--navy);color:#fff}button.gold{background:var(--gold);border-color:var(--gold);color:#0B1F3A;font-weight:700}
button.sm{padding:4px 10px;min-height:32px;font-size:13px}button.danger{border-color:var(--err);color:var(--err)}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid #1a5fd0;outline-offset:2px}
main{padding:16px 0 60px}
h1{font-size:22px;color:var(--navy);margin:6px 0 4px}h2{font-size:18px;color:var(--navy);margin:0 0 8px}h3{font-size:15px;color:var(--navy);margin:14px 0 6px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}}
.stat{border-left:5px solid var(--gold);background:#fff;border-radius:6px;padding:10px 12px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat b{display:block;font-size:24px;color:var(--navy)}.stat span{font-size:12.5px;color:var(--mut)}
.chip{display:inline-block;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600;border:1px solid}
.s-Draft{background:#eef1f6;color:#34425a;border-color:#9fb0cc}.s-Pending{background:#fff6dc;color:#6b4e00;border-color:var(--gold)}.s-Approved{background:#e3f4e8;color:#14602f;border-color:#7cc592}.s-Action{background:#fde9e7;color:#8e1b14;border-color:#e59a94}
.sample{background:#fff6dc;border:1px dashed var(--gold);padding:6px 10px;border-radius:6px;font-size:13px;margin:8px 0}
.areas{display:flex;flex-wrap:wrap;gap:8px}.areas button[aria-pressed=true]{background:var(--navy);color:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef1f6;color:var(--navy)}
.tablewrap{overflow-x:auto}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:3px solid var(--navy);margin-top:10px;padding-bottom:0}
.tabs button{border-radius:6px 6px 0 0;border-bottom:none;background:#e5e8ee;white-space:nowrap;min-height:44px;text-align:left}
.tabs button[aria-selected=true]{background:var(--navy);color:#fff}
.tabs small{display:block;font-size:11px;opacity:.9}
.bar{height:8px;background:#dde2ea;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.fg{margin:12px 0}.fg label,.lbl{display:block;font-weight:600;color:var(--navy);margin-bottom:2px}
.req{color:var(--err);margin-left:3px}.sr{position:absolute;left:-9999px}
.hint{font-size:13px;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid #8793a6;border-radius:6px;background:#fff;color:var(--ink);min-height:40px}
textarea{min-height:120px;resize:vertical}
input[readonly]{background:#eef1f6}
[aria-invalid=true]{border-color:var(--err)!important;box-shadow:0 0 0 1px var(--err)}
.msg{font-size:13px;min-height:0}.msg.e{color:var(--err);font-weight:600;margin-top:3px}.msg.w{color:var(--warn);font-weight:600;margin-top:3px}.msg.i{color:var(--mut);margin-top:3px}
.with-suf{display:flex;align-items:stretch}.with-suf input{border-radius:6px 0 0 6px}.suf{background:#eef1f6;border:1px solid #8793a6;border-left:none;border-radius:0 6px 6px 0;padding:8px 10px;white-space:nowrap;font-size:13px;color:var(--mut);display:flex;align-items:center}
.na{font-size:13px;margin-top:3px;display:flex;align-items:center;gap:6px}.na input{width:18px;height:18px}
.ind{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:12px 0;background:#fcfcfd}
.ind .cols{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:720px){.ind .cols{grid-template-columns:2fr 1fr 1fr 1fr}}
.row{display:grid;gap:8px;grid-template-columns:1fr;border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0;background:#fff;position:relative}
@media(min-width:720px){.row.c3{grid-template-columns:2fr 1fr 1fr auto}.row.c2{grid-template-columns:2fr 1fr auto}.row.c4{grid-template-columns:repeat(4,1fr) auto}.row.cp{grid-template-columns:2fr 1.4fr 1.4fr 1fr auto}}
.row .rn{font-weight:700;color:var(--navy)}
.ok{color:var(--ok)}.panel[hidden]{display:none}
.my{background:#fff3c4!important;font-weight:700}
.alert{border-left:5px solid var(--warn);background:#fff6dc;padding:8px 12px;border-radius:4px;margin:8px 0;font-size:14px}
.alert.e{border-color:var(--err);background:#fde9e7}
.alert.o{border-color:var(--ok);background:#e3f4e8}
.tag{display:grid;gap:6px;grid-template-columns:1fr 1fr;margin:6px 0;padding:8px;background:#f1f4f9;border-radius:6px}
@media(min-width:720px){.tag{grid-template-columns:repeat(4,1fr) auto}}
.cnt{font-size:12.5px;color:var(--mut);text-align:right}.cnt.over{color:var(--warn);font-weight:700}
.status{font-size:13px;color:#d7dde8}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.doc{background:#fff;border:1px solid var(--line);padding:18px;max-width:800px;margin:12px auto;font-size:13.5px}
.doc h1{border-bottom:3px solid var(--gold);padding-bottom:6px;font-size:20px}.doc h2{font-size:15px;border-bottom:1px solid var(--line);margin-top:16px;padding-bottom:3px}
.doc .wm{color:#7a1010;font-weight:700;font-size:12px}
.doc p{white-space:pre-wrap;margin:4px 0}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:6px;z-index:99;max-width:90vw}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px}
@media(max-width:600px){.who{margin-left:0;text-align:left;width:100%}h1{font-size:19px}.card{padding:10px}}
@media print{
 @page{size:A4;margin:14mm}
 body{background:#fff;font-size:11pt}
 .no-print,.banner,header.top,.tabs,footer{display:none!important}
 main{padding:0}.wrap{max-width:none;padding:0}
 .doc{border:none;padding:0;margin:0;max-width:none;font-size:10.5pt}
 .doc h2{break-after:avoid}.doc table,.doc .blk{break-inside:avoid}
 .panel:not(#panel-5){display:none!important}
}

/* ---------- helpers ---------- */
function num(s){if(s==null)return null;s=String(s).trim().replace(/\s/g,"");if(s==="")return null;
 if(/^[-+]?\d{1,3}((,\d{3}){2,}|(,\d{3})+\.\d+)$/.test(s))s=s.replace(/,/g,"");else if(/^[-+]?\d+,\d+$/.test(s))s=s.replace(",",".");
 return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)?parseFloat(s):NaN}
function fixNum(s){const t=String(s).trim();if(/^[-+]?\d{1,3}((,\d{3}){2,}|(,\d{3})+\.\d+)$/.test(t))return t.replace(/,/g,"");if(/^[-+]?\d+,\d+$/.test(t))return t.replace(",",".");return s}
const fmt=n=>n==null||isNaN(n)?"":Number(n).toLocaleString("en-US",{maximumFractionDigits:2});
function periodLabel(p){if(!p.kind||!p.year)return "";if(p.kind==="Annual")return "Annual "+p.year;if(p.kind==="Month")return "Latest month ("+(p.month?MON[+p.month-1]+" ":"")+p.year+")";return p.kind+" "+p.year}
function asAt(p){if(!p.kind||!p.year)return "";const y=+p.year;let d;
 if(p.kind==="Annual")d=new Date(Date.UTC(y,11,31));else if(p.kind==="Month"){if(!p.month)return "";d=new Date(Date.UTC(y,+p.month,0))}else d=new Date(Date.UTC(y,+p.kind[1]*3,0));
 return d.toISOString().slice(0,10)}
function aseanInfo(d){const rows=d.trade.as.rows.map(r=>({c:r.k,v:num(r.v)})).filter(r=>r.c&&r.v!=null&&!isNaN(r.v)&&r.v>=0).sort((a,b)=>b.v-a.v);
 const tot=rows.reduce((a,r)=>a+r.v,0);const my=rows.find(r=>r.c==="Malaysia");let rank=null;
 if(my)rank=1+rows.filter(r=>r.v>my.v).length;
 return{rows,tot,rank,n:rows.length,above:my?rows.filter(r=>r.v>my.v):[],my}}

/* ---------- validation ---------- */
function validate(d){
 const miss=[],errs=[],warns=[],msgs={},units={1:new Set(),2:new Set(),3:new Set(),4:new Set()},bad={1:new Set(),2:new Set(),3:new Set(),4:new Set()};
 const unit=(tab,u,m)=>{units[tab].add(u);if(m){miss.push(Object.assign({tab},m));bad[tab].add(u)}};
 const M=(id,t,text,tab,label)=>{if(!msgs[id]||(t==="e"))msgs[id]={t,text};if(t==="e")errs.push({id,tab,label,text});if(t==="w")warns.push({id,tab,label,text})};
 // tab1
 if(d.reportType==="CG"){unit(1,"city",d.city.trim()?null:{id:"rt-city",label:"Report details: city / region"});unit(1,"scope",d.scope?null:{id:"rt-scope",label:"Report details: national or local figures?"});}
 SA.forEach(s=>{const t=d.sa[s[0]].text.trim();unit(1,s[0],t?null:{id:"sa-"+s[0],label:"Strategic Assessment – "+s[1].replace(/^[ivx]+\) /,"")});
  if(t&&t.length<40)M("sa-"+s[0],"w","Very short – please add specific developments, reasons and follow-up.",1,s[1]);
  if(t.length>1500)M("sa-"+s[0],"w","Over the soft limit of ~1,500 characters – consider shortening (not blocked).",1,s[1])});
 // tab2
 const mp=d.macro.period;
 unit(2,"period",mp.kind&&mp.year&&(mp.kind!=="Month"||mp.month)?null:{id:mp.kind?(mp.year?"mp-month":"mp-year"):"mp-kind",label:"Macro Snapshot: reporting period (type and year)"});
 const na={};
 MF.forEach(m=>{const f=d.macro.f[m.k];const id="m-"+m.k;na[m.k]=f.na;
  if(m.b){unit(2,"b-"+m.b,f.na||d.macro.basis[m.b]?null:{id:"mb-"+m.b,label:"Macro Snapshot: "+BASIS[m.b]})}
  if(f.na){units[2].add(m.k);return}
  const raw=String(f.v).trim();
  if(!raw){unit(2,m.k,{id,label:"Macro Snapshot – "+m.l+" (enter a value or tick 'Data not available')"});return}
  units[2].add(m.k);const n=num(raw);
  if(isNaN(n)){M(id,"e","Enter a number, e.g. 3.5 (a comma decimal such as 3,5 will be converted).",2,m.l);bad[2].add(m.k);return}
  if(m.pos&&n<=0)M(id,"w","Must be greater than zero.",2,m.l);
  else if(n<m.lo||n>m.hi)M(id,"w","Outside the plausible range ("+fmt(m.lo)+" to "+fmt(m.hi)+" "+m.u.split(" ")[0]+") – please check the value and unit.",2,m.l);
  if(!f.src)M("m-"+m.k+"-src","i","",2,m.l)});
 const g=num(d.macro.f.gdp.v),pc=num(d.macro.f.gdpPc.v),pp=num(d.macro.f.pop.v);
 if(!na.gdp&&!na.gdpPc&&!na.pop&&[g,pc,pp].every(x=>x!=null&&!isNaN(x)&&x>0)){
  const calc=g*1000/pp,r=pc/calc;
  if(r<0.7||r>1.3){let hint="";const alts=[["GDP may be in USD million instead of billion – divide it by 1,000",g/1000,pp],["GDP may be in USD trillion – multiply by 1,000",g*1000,pp],["population may be in thousands instead of millions",g,pp/1000],["population may be in persons/billions – check the unit",g,pp*1000]];
   for(const a of alts){const c=a[1]*1000/a[2];if(pc/c>=0.7&&pc/c<=1.3){hint=" Hint: "+a[0]+".";break}}
   const txt="Cross-check: GDP ÷ population = about USD "+fmt(calc)+" per person, but GDP per capita entered is USD "+fmt(pc)+" ("+Math.round(Math.abs(r-1)*100)+"% off)."+hint+" Did you enter millions instead of billions? GDP is in USD billion; population in million persons.";
   M("m-gdpPc","w",txt,2,"GDP per capita");M("m-gdp","w","See the cross-check warning on GDP per capita.",2,"GDP value")}
  else M("m-gdpPc","i","Cross-check OK: GDP ÷ population ≈ GDP per capita (within 30%).",2,"GDP per capita")}
 // tab3
 const tp=d.trade.period;
 unit(3,"period",tp.kind&&tp.year&&(tp.kind!=="Month"||tp.month)?null:{id:tp.kind?(tp.year?"tp-month":"tp-year"):"tp-kind",label:"Trade Profile: data period (type and year)"});
 Object.keys(TL).forEach(k=>{const L=d.trade[k],T=TL[k];if(L.na){units[3].add(k);return}
  let filled=0,first=null;const seen={};
  L.rows.forEach((r,i)=>{const id=`${k}-${i}`,v=String(r.v).trim(),has=r.k||v;
   if(!has){if(first==null)first=i;return}
   if(!r.k){unit(3,k,{id:id+"-k",label:`${T.t.replace(/^[iv]+\) /,"")} row ${i+1}: ${T.type==="hs"?"HS chapter":"country"}`});return}
   if(!v){unit(3,k,{id:id+"-v",label:`${T.t.replace(/^[iv]+\) /,"")} row ${i+1}: value (USD million)`});return}
   const n=num(v);if(isNaN(n)||n<0){M(id+"-v","e","Enter a number ≥ 0 in USD million.",3,"Trade value");bad[3].add(k);return}
   if(T.type!=="hs"&&!COUNTRIES.includes(r.k)){M(id+"-k","e","Pick a country from the list.",3,"Country");bad[3].add(k);return}
   if(T.type==="a"&&!ASEAN.includes(r.k)){M(id+"-k","e","Not an ASEAN member – pick from the list.",3,"ASEAN partner");bad[3].add(k);return}
   if(seen[r.k]!=null){M(id+"-k","e","Duplicate – already listed in row "+(seen[r.k]+1)+".",3,"Duplicate");bad[3].add(k);return}
   seen[r.k]=i;filled++;
   const sh=num(r.s);if(r.s!==""&&r.s!=null&&(isNaN(sh)||sh<0||sh>100))M(id+"-s","w","Share should be between 0 and 100%.",3,"Share")});
  units[3].add(k);
  if(filled<T.min&&!bad[3].has(k)){const idx=first!=null?first:0;unit(3,k,{id:`${k}-${idx}-${T.type==="hs"?"k":"k"}`,label:`${T.t.replace(/^[iv]+\) /,"")}: ${filled} of ${T.min} entries (add more or tick 'Data not available')`})}
 });
 // tab4
 KP.forEach(x=>{const C=d.kp[x[0]];if(C.na){units[4].add(x[0]);return}
  const rows=C.rows.filter(r=>r.name.trim());
  if(!rows.length){unit(4,x[0],{id:`kp-${x[0]}-0-name`,label:"Key Players – "+x[1]+": add at least one entry or tick 'None / not applicable'"});return}
  units[4].add(x[0]);const seen={};
  C.rows.forEach((r,i)=>{if(!r.name.trim())return;const key=r.name.trim().toLowerCase();
   if(!r.ind){unit(4,x[0],{id:`kp-${x[0]}-${i}-ind`,label:`Key Players – ${x[1]} row ${i+1}: ${x[0]==="my"?"sector":"industry"}`})}
   if(seen[key]!=null){M(`kp-${x[0]}-${i}-name`,"e","Duplicate of row "+(seen[key]+1)+".",4,"Duplicate");bad[4].add(x[0])}else seen[key]=i;
   if(r.val&&isNaN(num(r.val))){M(`kp-${x[0]}-${i}-val`,"e","Enter a number (USD million).",4,"Value");bad[4].add(x[0])}})});
 // required messages shown only when touched
 miss.forEach(m=>{if(!msgs[m.id])msgs[m.id]={t:"e",text:"Required – "+(m.label.split("–").pop().trim()),req:1}});
 const prog={};let tot=0,ok=0;[1,2,3,4].forEach(t=>{const T=units[t].size,B=bad[t].size;prog[t]={t:T,ok:Math.max(0,T-B)};tot+=T;ok+=prog[t].ok});
 const nosrc=MF.filter(m=>!d.macro.f[m.k].na&&String(d.macro.f[m.k].v).trim()&&!d.macro.f[m.k].src).length;
 return{miss,errs,warns:warns.filter(w=>!/^See the/.test(w.text)),msgs,prog,pct:tot?Math.round(ok/tot*100):0,nosrc};
}

document.addEventListener("focusout",e=>{const t=e.target;if(!t.dataset||!t.dataset.path||ui.view!=="form")return;const d=cur();ui.touched.add(t.id);
 if(t.dataset.num&&t.type==="text"){const f=fixNum(t.value);if(f!==t.value){t.value=f;setP(d,t.dataset.path,f);toast("Comma converted: "+f);queueSave()}}
 if(t.dataset.kind==="country"&&t.value){const c=COUNTRIES.find(x=>x.toLowerCase()===t.value.trim().toLowerCase());if(c&&c!==t.value){t.value=c;setP(d,t.dataset.path,c);queueSave()}}
 if(t.dataset.kind==="mycompany"&&t.value){const n=normCompany(t.value);if(n){if(n!==t.value){t.value=n;setP(d,t.dataset.path,n);ui.info[t.id]="Normalised to “"+n+"” so the same company is counted together.";queueSave()}else delete ui.info[t.id]}else ui.info[t.id]="Not in the suggestion list – free text accepted. Please use the company's official name."}
 refresh()});
function renderForm_keepTab(fid){renderPanel(fid)}
function go(tab,jump){ui.tab=tab;renderForm();if(jump){const e=document.getElementById(jump);if(e){e.scrollIntoView({block:"center"});e.focus();ui.touched.add(jump);refresh()}}}
function download(name,type,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csvOf(d){const R=[["section","field","value","unit","basis","source","source_date"]];const m=d.macro;
 R.push(["meta","economy",d.econ,"","","",""],["meta","report_type",d.reportType==="CG"?"Consulate-General":"Country-level","","","",""],["meta","figures_scope",d.scope,"","","",""],["macro","period",periodLabel(m.period),"","","",""],["macro","data_as_at",asAt(m.period),"","","",""]);
 MF.forEach(x=>{const f=m.f[x.k];R.push(["macro",x.l,f.na?"NOT AVAILABLE":f.v,x.u,x.b?m.basis[x.b]:"",f.src,f.srcDate])});
 R.push(["trade","period",periodLabel(d.trade.period),"","","",""]);
 Object.keys(TL).forEach(k=>{const L=d.trade[k];L.rows.filter(r=>r.k||r.v).forEach((r,i)=>R.push(["trade_"+k,(i+1)+" "+r.k,r.v,"USD million","",L.src,L.srcDate]))});
 const a=aseanInfo(d);R.push(["derived","malaysia_rank_asean",a.rank==null?"not listed":a.rank,"","","",""],["derived","asean_competitors_ahead",a.above.map(r=>r.c).join("; "),"","","",""]);
 SA.forEach(s=>R.push(["strategic",s[1],d.sa[s[0]].text,"","","",""]));
 KP.forEach(x=>d.kp[x[0]].rows.filter(r=>r.name).forEach(r=>R.push(["key_players_"+x[0],r.name,r.ind,"","","",""])));
 return R.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\r\n")}
document.addEventListener("click",e=>{const t=e.target.closest("[data-area],[data-open],[data-act],[data-tab],[data-jump]");if(!t)return;
 if(t.dataset.jump){e.preventDefault();ui.showAll=true;go(+t.dataset.tab,t.dataset.jump);return}
 if(t.dataset.area){S.area=t.dataset.area;save();renderDash();return}
 if(t.dataset.open){ui.cur=t.dataset.open;ui.view="form";ui.tab=1;ui.touched=new Set();ui.showAll=false;ui.info={};renderForm();window.scrollTo(0,0);return}
 if(t.dataset.tab&&t.getAttribute("role")==="tab"){ui.tab=+t.dataset.tab;renderForm();$("#tabbtn-"+ui.tab).focus();return}
 const a=t.dataset.act;if(!a)return;const d=ui.view==="form"?cur():null;
 if(a==="back"){save();ui.view="dash";renderDash();window.scrollTo(0,0)}
 else if(a==="reset"){if(confirm("Reset all sample data in this browser?")){localStorage.removeItem(KEY);S=demo();save();renderDash();toast("Demo data restored")}}
 else if(a==="prevtab"){go(Math.max(1,ui.tab-1));window.scrollTo(0,0)}
 else if(a==="nexttab"){go(Math.min(5,ui.tab+1));window.scrollTo(0,0)}
 else if(a==="addrow"){const k=t.dataset.key;d.trade[k].rows.push({k:"",v:"",s:""});queueSave();renderPanel(`${k}-${d.trade[k].rows.length-1}-k`)}
 else if(a==="addkp"){const k=t.dataset.key;d.kp[k].rows.push({name:"",ind:"",proj:"",val:""});queueSave();renderPanel(`kp-${k}-${d.kp[k].rows.length-1}-name`)}
 else if(a==="addtag"){d.sa[t.dataset.key].tags.push({sector:"",type:"",urgency:"",agency:""});queueSave();renderPanel(`tg-${t.dataset.key}-${d.sa[t.dataset.key].tags.length-1}-sector`)}
 else if(a==="rmrow"){const L=getP(d,t.dataset.list);const i=+t.dataset.i;logChange(d,"Removed row",t.dataset.list+" #"+(i+1),"");L.splice(i,1);
  if(!L.length&&/rows$/.test(t.dataset.list)){L.push(t.dataset.list.startsWith("kp")?{name:"",ind:"",proj:"",val:""}:{k:"",v:"",s:""})}queueSave();renderPanel();toast("Row removed")}
 else if(a==="clearsample"){if(confirm("Clear the sample data from this dossier and start blank?")){const n=blank(d.econ);n.status="Draft";S.dossiers[d.econ]=n;save();renderForm()}}
 else if(a==="print"){window.print()}
 else if(a==="json"){const x=aseanInfo(d);download("dossier-"+d.econ+".json","application/json",JSON.stringify({prototype:true,note:"Sample export. In the real system this structured data could be provided to JPDP.",mission:MISSION,dossier:d,derived:{malaysiaRankAsean:x.rank,asean_competitors_ahead:x.above.map(r=>r.c),macroDataAsAt:asAt(d.macro.period),tradeDataAsAt:asAt(d.trade.period)}},null,2));toast("JSON exported")}
 else if(a==="csv"){download("dossier-"+d.econ+".csv","text/csv",csvOf(d));toast("CSV exported")}
 else if(a==="withdraw"){d.status="Draft";logChange(d,"Status","Pending approval","Draft");save();renderForm()}
 else if(a==="submit"){ui.showAll=true;const v=validate(d);refresh();if(v.miss.length||v.errs.length){toast("Cannot submit: "+(v.miss.length+v.errs.length)+" item(s) need attention");const c=$("#complete");if(c){c.scrollIntoView({block:"center"});}return}
  if(confirm("Submit this dossier? (Prototype: only the status in this browser changes.)")){d.status="Pending";logChange(d,"Status","Draft","Pending approval");d.updated=new Date().toISOString();save();renderForm();toast("Submitted (prototype only)")}}});
document.addEventListener("keydown",e=>{const t=e.target;if(t.getAttribute&&t.getAttribute("role")==="tab"&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const n=Math.min(5,Math.max(1,ui.tab+(e.key==="ArrowRight"?1:-1)));ui.tab=n;renderForm();$("#tabbtn-"+n).focus()}});

/* ---------- boot ---------- */
$("#app").innerHTML="";renderDash();
window.__edms={S:()=>S,validate,cur};
})();
</script></body></html>
